events {}

http {
  server_tokens off;

  client_max_body_size 200M;
  
  server {
    listen 80;
    server_name localhost;

    location / {
      # Перенаправляем запросы в контейнер 'app' на порт 8000
      proxy_pass http://app:8000;
      
      # Стандартные заголовки для прокси
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # Таймауты для долгих запросов
      proxy_connect_timeout 300s;
      proxy_read_timeout 300s;
      
      # Добавляем заголовок, чтобы убрать страницу-предупреждение Ngrok
      add_header 'ngrok-skip-browser-warning' 'true' always;
    }
  }
}